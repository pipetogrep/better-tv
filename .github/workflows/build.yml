name: Build

# Every push to main builds the APK (kept as a workflow artifact).
# Pushing a version tag (v1.2.3) also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # build.sh numbers versions by commit count and names them by tag

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK pieces build.sh needs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing key
        # Never for pull requests: they build with a throwaway key.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No SIGNING_KEYSTORE_B64 secret: building with a throwaway key."
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_KEYSTORE_PASS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEYSTORE_PASS || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.SIGNING_KEY_ALIAS || '' }}
        run: |
          ./build.sh
          cp build/better-tv.apk "better-tv-${{ steps.version.outputs.name }}.apk"

      - name: Only the built-in backgrounds in the APK
        # Personal photos come from the TV's Pictures/BetterTV folder, never from the app; the
        # only pictures bundled are the built-in backgrounds in assets/backgrounds.
        run: |
          if unzip -l better-tv-*.apk | awk '{print $4}' | grep -iE '\.(jpe?g|png|webp)$' \
              | grep -vxE 'assets/backgrounds/(fabric|orbs|ribbons)\.jpg'; then
            echo "::error::The APK contains unexpected pictures"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: better-tv-${{ steps.version.outputs.name }}
          path: better-tv-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job can publish
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: better-tv-${{ needs.apk.outputs.version }}

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Re-running a tag's build replaces the APK instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" better-tv-*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" better-tv-*.apk \
              --title "Better TV ${{ needs.apk.outputs.version }}" --generate-notes
          fi
